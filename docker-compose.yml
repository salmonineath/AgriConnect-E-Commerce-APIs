services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agriconnect-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      # Inside the compose network the DB is reached by its service name, not localhost
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin}@mongo:27017/argiconnectdb?authSource=admin
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot reload; keep the container's own node_modules
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7 # mongo:8 crashes on Linux kernel 6.19–7.0.13 (SERVER-121912)
    container_name: agriconnect-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: argiconnectdb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
